{% load static %}
<div class="z-10 border-b border-bordercl top-0 left-0 right-0 bg-background2 m-0 shadow-md fixed flex justify-between h-14
    md:left-32 xl:left-53 md:border-l md:h-14 lg:border-b-0" id="topbar">
    <div class="hidden items-center justify-center font-semibold font-sgothic text-2xl xl:pl-8 md:flex">
        <i class="ri-user-settings-line"></i>{{topbar_title}}
    </div>
    <div class="flex w-full justify-between items-center gap-4 md:justify-end md:p-3">
        <button id="menu-btn" class="ml-4 md:hidden">
            <i class="ri-menu-line text-2xl" id="hamburger"></i>
        </button>
        <div class="bg-background flex justify-between items-center h-6 w-16 cursor-pointer rounded-md p-2" id="#theme-toggle-btn">
            <i class="ri-sun-line text-2xl"></i>
            <i class="ri-moon-line text-xl"></i>
        </div>
        <div class="flex gap-4 text-right">
            <div class="hidden md:block">
                <p class="font-sgothic font-bold">Hey, Admin</b></p>
                <p class="font-sgothic">{{school.school_name.title}}</p>
            </div>
            <div class="mr-4 overflow-hidden w-11 h-11 rounded-md border border-activeb">
                <img src="{% static 'project/images/logo.png' %}" alt="Profile pic" class="object-center object-cover">
            </div>
        </div>
    </div>
</div>
